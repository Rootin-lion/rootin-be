name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시
        run: |
          docker build -t syeonx41/rootin-be:latest .
          docker push syeonx41/rootin-be:latest

      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull syeonx41/rootin-be:latest
            docker stop rootin-be || true
            docker rm rootin-be || true
            docker run -d --name rootin-be \
              --network rootin-net \
              --env-file /home/ubuntu/.env \
              -p 8080:8080 \
              --restart unless-stopped \
              syeonx41/rootin-be:latest